<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#17110a">
  <meta name="description" content="First Empire — an original classical-age real-time strategy game.">
  <title>First Empire — Classical Age RTS</title>
  <style>
    html,body{height:100%;margin:0;background:#17110a;color:#ead9af;font-family:Georgia,serif}
    body{display:grid;place-items:center;overflow:hidden}
    .boot{width:min(86vw,620px);text-align:center;padding:32px}
    h1{margin:0 0 12px;font-size:clamp(2rem,8vw,4.5rem);letter-spacing:.08em}
    h1 span{color:#c7a258}
    p{opacity:.8;line-height:1.55}
    .bar{height:4px;background:#3a2c1b;margin:24px auto 0;overflow:hidden;max-width:340px}
    .bar::after{content:"";display:block;height:100%;width:45%;background:#c7a258;animation:move 1s ease-in-out infinite alternate}
    @keyframes move{to{transform:translateX(122%)}}
    .error{white-space:pre-wrap;color:#ffcabd;font:14px/1.5 system-ui,sans-serif;text-align:left}
    .retry{margin-top:18px;padding:10px 18px;border:1px solid #c7a258;background:#24180d;color:#ead9af;font:600 14px system-ui,sans-serif;cursor:pointer}
  </style>
</head>
<body>
  <main class="boot" id="boot" aria-live="polite">
    <h1>FIRST <span>EMPIRE</span></h1>
    <p id="status">Raising the River Kingdom…</p>
    <div class="bar" aria-hidden="true"></div>
  </main>
  <script>
  (() => {
    'use strict';

    const packageVersion = '20260902.3-touch';
    const chunkPaths = Array.from({ length: 8 }, (_, index) =>
      `./payload/touch-v2/game-${String(index).padStart(2, '0')}.bin`
    );
    const expectedCompressedBytes = 42266;
    const expectedCompressedDigest = 'd4da728dc141cafb571d28e6f92c844d4a709a5eef4a837352e7f0ff8a48a52e';
    const status = document.getElementById('status');

    const fail = error => {
      const boot = document.getElementById('boot');
      boot.className = 'boot error';
      boot.replaceChildren();
      const message = document.createElement('div');
      message.textContent = `The game could not be started.\n\n${error instanceof Error ? error.message : String(error)}`;
      const retry = document.createElement('button');
      retry.className = 'retry';
      retry.type = 'button';
      retry.textContent = 'RETRY';
      retry.addEventListener('click', () => location.reload());
      boot.append(message, retry);
    };

    const toHex = buffer => Array.from(new Uint8Array(buffer), byte =>
      byte.toString(16).padStart(2, '0')
    ).join('');

    const loadChunk = async path => {
      const url = new URL(path, document.baseURI);
      url.searchParams.set('v', packageVersion);
      const response = await fetch(url, { cache: 'no-store' });
      if (!response.ok) {
        throw new Error(`Game package request failed for ${path} (HTTP ${response.status}).`);
      }
      return new Uint8Array(await response.arrayBuffer());
    };

    (async () => {
      try {
        if (!('DecompressionStream' in window)) {
          throw new Error('This browser lacks the gzip decompression feature required to load the game. Use a current Chrome, Edge, Firefox, or Safari release.');
        }

        status.textContent = 'Loading the battlefield…';
        const chunks = await Promise.all(chunkPaths.map(loadChunk));
        const receivedBytes = chunks.reduce((total, chunk) => total + chunk.length, 0);
        if (receivedBytes !== expectedCompressedBytes) {
          throw new Error(`The game package is incomplete (${receivedBytes} of ${expectedCompressedBytes} bytes).`);
        }

        const compressed = new Uint8Array(receivedBytes);
        let offset = 0;
        for (const chunk of chunks) {
          compressed.set(chunk, offset);
          offset += chunk.length;
        }

        if (globalThis.crypto?.subtle) {
          const digest = toHex(await crypto.subtle.digest('SHA-256', compressed));
          if (digest !== expectedCompressedDigest) {
            throw new Error('The game package failed its integrity check.');
          }
        }

        status.textContent = 'Founding the first settlement…';
        const decompressed = new Response(compressed).body
          .pipeThrough(new DecompressionStream('gzip'));
        const html = await new Response(decompressed).text();

        if (!/^\s*<!doctype html>/i.test(html) || !html.includes('id="startButton"')) {
          throw new Error('The decoded game document is invalid.');
        }

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error('First Empire loader failed:', error);
        fail(error);
      }
    })();
  })();
  </script>
</body>
</html>
